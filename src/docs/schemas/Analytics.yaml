Analytics:
  type: object
  required: [overview, deviceBreakdown, dailyStats, topPages, topCountries, topBrowsers]
  properties:
    overview:
      type: object
      required: [totalVisitors, uniqueVisitors, pageViews, bounceRate, avgTimeSpent]
      properties:
        totalVisitors: { type: number }
        uniqueVisitors: { type: number }
        pageViews: { type: number }
        bounceRate: { type: number }
        avgTimeSpent: { type: number, description: Tempo médio em segundos }
    deviceBreakdown:
      type: object
      properties:
        desktop: { type: number }
        mobile: { type: number }
        tablet: { type: number }
    dailyStats:
      type: array
      items: { $ref: "#/components/schemas/DailyAnalytics" }
    topPages:
      type: array
      items:
        type: object
        properties: { page: { type: string }, views: { type: number } }
    topCountries:
      type: array
      items:
        type: object
        properties: { country: { type: string }, visitors: { type: number } }
    topBrowsers:
      type: array
      items:
        type: object
        properties: { browser: { type: string }, visitors: { type: number } }

DailyAnalytics:
  type: object
  required: [date, totalVisitors, uniqueVisitors, pageViews]
  properties:
    date: { type: string, format: date }
    totalVisitors: { type: number }
    uniqueVisitors: { type: number }
    pageViews: { type: number }

RealTimeAnalytics:
  type: object
  required: [online, activeVisitors, topActivePages, recentVisitors]
  properties:
    online: { type: number }
    activeVisitors: { type: number }
    topActivePages:
      type: array
      items:
        type: object
        properties: { page: { type: string }, activeUsers: { type: number } }
    recentVisitors:
      type: array
      items:
        type: object
        properties:
          country: { type: string }
          device: { type: string }
          page: { type: string }
          timestamp: { type: string, format: date-time }
    totals: { type: object, additionalProperties: true }
    countries: { type: object, additionalProperties: true }
    referrers: { type: object, additionalProperties: true }

AnalyticsSummary:
  type: object
  required: [today, week, month, realTime]
  properties:
    today:
      type: object
      properties: { visitors: { type: number }, change: { type: number } }
    week:
      type: object
      properties: { visitors: { type: number } }
    month:
      type: object
      properties: { visitors: { type: number } }
    realTime:
      $ref: "#/components/schemas/RealTimeAnalytics"
    realTime:
      $ref: "#/components/schemas/RealTimeAnalytics"

TrackVisitorRequest:
  type: object
  required: [sessionId, userAgent, device, landingPage]
  properties:
    sessionId: { type: string, maxLength: 255 }
    userAgent: { type: string, maxLength: 500 }
    country: { type: string, maxLength: 100 }
    city: { type: string, maxLength: 100 }
    device: { type: string, enum: [desktop, mobile, tablet] }
    browser: { type: string, maxLength: 100 }
    os: { type: string, maxLength: 100 }
    referrer: { type: string, format: uri }
    landingPage: { type: string, maxLength: 500 }

TrackPageViewRequest:
  type: object
  required: [sessionId, page]
  properties:
    sessionId: { type: string, maxLength: 255 }
    page: { type: string, maxLength: 500 }
    timeSpent: { type: number, minimum: 0, maximum: 86400 }
