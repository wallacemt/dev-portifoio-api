/api/analytics/private/dashboard:
  get:
    tags: [Analytics]
    summary: Busca analytics do Umami
    security: [{ bearerAuth: [] }]
    parameters:
      - in: query
        name: startDate
        schema: { type: string, format: date }
      - in: query
        name: endDate
        schema: { type: string, format: date }
    responses:
      "200": { description: Métricas retornadas, content: { application/json: { schema: { $ref: "#/components/schemas/Analytics" } } } }
      "400": { description: Intervalo inválido }
      "401": { description: Não autenticado }
      "502": { description: Analytics indisponível }
      "503": { description: Analytics não configurado }

/api/analytics/private/summary:
  get:
    tags: [Analytics]
    summary: Busca resumo de analytics
    security: [{ bearerAuth: [] }]
    responses:
      "200": { description: Resumo retornado, content: { application/json: { schema: { $ref: "#/components/schemas/AnalyticsSummary" } } } }
      "401": { description: Não autenticado }
      "502": { description: Analytics indisponível }
      "503": { description: Analytics não configurado }

/api/analytics/private/realtime:
  get:
    tags: [Analytics]
    summary: Busca analytics em tempo real
    security: [{ bearerAuth: [] }]
    responses:
      "200":
        description: Analytics em tempo real
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealTimeAnalytics" }
      "401": { description: Não autenticado }
      "502": { description: Analytics indisponível }
      "503": { description: Analytics não configurado }
