/api/analytics/{ownerId}/track-visitor:
  post:
    tags: [Analytics]
    summary: Registra um visitante no coletor legado durante a migração
    parameters:
      - in: path
        name: ownerId
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TrackVisitorRequest" }
    responses:
      "201": { description: Visitante registrado }
      "200": { description: Visitante já registrado }
      "400": { description: Dados inválidos }

/api/analytics/{ownerId}/track-pageview:
  post:
    tags: [Analytics]
    summary: Registra uma visualização no coletor legado durante a migração
    parameters:
      - in: path
        name: ownerId
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [pageView, visitor]
            properties:
              pageView: { $ref: "#/components/schemas/TrackPageViewRequest" }
              visitor: { $ref: "#/components/schemas/TrackVisitorRequest" }
    responses:
      "201": { description: Visualização registrada }
      "400": { description: Dados inválidos }

/api/analytics/private/dashboard:
  get:
    tags: [Analytics]
    summary: Busca analytics do Umami
    security: [{ bearerAuth: [] }]
    parameters:
      - in: query
        name: startDate
        schema: { type: string, format: date }
      - in: query
        name: endDate
        schema: { type: string, format: date }
    responses:
      "200": { description: Métricas retornadas, content: { application/json: { schema: { $ref: "#/components/schemas/Analytics" } } } }
      "400": { description: Intervalo inválido }
      "401": { description: Não autenticado }
      "502": { description: Analytics indisponível }
      "503": { description: Analytics não configurado }

/api/analytics/private/summary:
  get:
    tags: [Analytics]
    summary: Busca resumo de analytics
    security: [{ bearerAuth: [] }]
    responses:
      "200": { description: Resumo retornado, content: { application/json: { schema: { $ref: "#/components/schemas/AnalyticsSummary" } } } }
      "401": { description: Não autenticado }
      "502": { description: Analytics indisponível }
      "503": { description: Analytics não configurado }

/api/analytics/private/realtime:
  get:
    tags: [Analytics]
    summary: Busca analytics em tempo real
    security: [{ bearerAuth: [] }]
    responses:
      "200":
        description: Analytics em tempo real
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealTimeAnalytics" }
      "401": { description: Não autenticado }
      "502": { description: Analytics indisponível }
      "503": { description: Analytics não configurado }
