services:
  redis:
    image: redis:7-alpine
    container_name: dev-portifolio-ws-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  app:
    build: .
    container_name: dev-portifolio-ws-backend
    ports:
      - "8081:8081"
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./src:/app/src
      - ./src/docs:/app/src/docs
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json

  # Translation worker (RF-05) — same image as `app`, no port exposed. Requires
  # REDIS_URL at boot (ADR-04): without it, the daily quota counter can't be
  # shared with `app`, so the worker refuses to start (see worker-entry.ts).
  worker:
    build: .
    container_name: dev-portifolio-ws-worker
    command: ["bun", "dist/src/worker-entry.js"]
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json

  # Local models for bulk/offline translation runs — opt-in via AI_BASE_URL.
  # Not wired into `app`/`worker` by default; point AI_BASE_URL at
  # http://ollama:11434/v1/chat/completions and AI_MODEL at translategemma:4b
  # (after `docker exec <container> ollama pull translategemma:4b`) to route
  # translation here instead of OpenRouter — aiService.ts routes any
  # "translategemma"-prefixed model through its dedicated per-field path.
  ollama:
    image: ollama/ollama
    container_name: dev-portifolio-ws-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  redis-data:
  ollama-data:
